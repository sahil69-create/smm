  <head>
    <meta charset="utf-8" />

    <meta name="keywords" content="BoostAurn registration, social media marketing account, BoostAurn signup" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta
      name="description"
      content="BoostAurn is a premium social media marketing panel for reliable campaign delivery, clear pricing, and order control."
    />
    <meta property="og:title" content="Create account · BoostAurn" />
    <meta
      property="og:description"
      content="Manage social media marketing campaigns with BoostAurn."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BoostAurn" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://boostaurn.shop/register.html" />
    <meta property="og:image" content="https://boostaurn.shop/images/og-image.svg" />
    <meta property="og:image:alt" content="BoostAurn social media marketing panel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Create account · BoostAurn" />
    <meta name="twitter:description" content="Create your BoostAurn account and manage social media campaigns." />
    <meta name="twitter:site" content="@boostaurn" />
    <meta name="twitter:image" content="https://boostaurn.shop/images/og-image.svg" />

    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/seo.js"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="brand" style="color: #16352e">Boost<span>Aurn</span></div>
      <p class="eyebrow" style="margin-top: 45px">Get started</p>
      <h1>Create your account</h1>
      <p id="error" class="hide" style="color: #d44"></p>
      <form onsubmit="submitAuth(event, 'register')" class="grid" style="margin-top: 24px">
        <div class="field"><label>Name</label><input name="name" required /></div>
        <div class="field"><label>Email</label><input name="email" type="email" required /></div>
        <div class="field">
          <label for="register-password">Password</label>
          <div class="password-field">
            <input id="register-password" name="password" type="password" minlength="8" required />
            <button type="button" class="password-toggle" data-password-toggle="register-password">Show</button>
          </div>
        </div>
        <button class="btn btn-primary">Create account</button>
      </form>
      <p class="sub" style="margin-top: 20px">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
